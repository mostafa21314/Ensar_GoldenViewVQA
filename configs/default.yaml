# Local nuScenes root holding samples/CAM_*.
# Overridden by the NUSCENES_ROOT env var.
# On the SSD: the external drive is HFS+ and the kernel mounts it read-only.
# This root already carries the v1.0-trainval metadata and maps.
nuscenes_root: /home/g6/nuscenes

# GoldenViewVQA dataset checkout (gitignored, see external/.goldenview-commit)
dataset_dir: external/goldenview

# Local SSD cache holding only the 438 images the benchmark references (~50 MB).
# Populated from nuscenes_root so work does not depend on the external drive
# being mounted. Resolution order: image_cache, then nuscenes_root.
image_cache: data/image_cache
